name: Windows Preview Package

on:
  workflow_dispatch:
    inputs:
      native_smoke:
        description: Run native API smoke checks (does not verify appearance or IME)
        type: boolean
        default: true
      expected_tag:
        description: Optional Cargo version check, for example v1.1.0-alpha.1
        type: string
        default: ''

permissions:
  contents: read

jobs:
  preview-package:
    name: Build and validate preview (no public release)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          Get-ChildItem scripts,installer -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null; $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Ensure Inno Setup 6
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          }
      - name: Build tested package
        shell: pwsh
        env:
          EXPECTED_TAG: ${{ inputs.expected_tag }}
          NATIVE_SMOKE: ${{ inputs.native_smoke }}
        run: ./scripts/package-windows.ps1 -RunNativeSmoke:($env:NATIVE_SMOKE -eq 'true') -ExpectedTag $env:EXPECTED_TAG
      - name: Validate installed payload and running update/uninstall
        shell: pwsh
        run: ./scripts/test-installer.ps1
      - name: Upload review package
        uses: actions/upload-artifact@v4
        with:
          name: MacLauncher-preview-${{ github.sha }}
          path: target/installer/
          if-no-files-found: error
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MacLauncher-validation-${{ github.sha }}
          path: target/validation-logs/
          if-no-files-found: warn
