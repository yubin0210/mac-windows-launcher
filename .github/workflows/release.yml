name: Release macOS System Launcher for Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build win-launcher (Release Mode)
        run: |
          cargo build --release -p win-launcher

      - name: Verify win-launcher.exe Exists
        shell: pwsh
        run: |
          $exePath = "target\release\win-launcher.exe"
          if (-not (Test-Path $exePath)) {
            throw "Error: $exePath was not found!"
          }
          $sizeMb = [math]::Round((Get-Item $exePath).Length / 1MB, 2)
          Write-Host "Successfully compiled win-launcher.exe: $sizeMb MB"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\MacLauncher.iss

      - name: Verify MacLauncher-Setup.exe Exists
        shell: pwsh
        run: |
          $setupPath = "target\installer\MacLauncher-Setup.exe"
          if (-not (Test-Path $setupPath)) {
            throw "Error: $setupPath was not found!"
          }
          $sizeMb = [math]::Round((Get-Item $setupPath).Length / 1MB, 2)
          Write-Host "Successfully created MacLauncher-Setup.exe: $sizeMb MB"

      - name: Create GitHub Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: macOS System Launcher ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            target/installer/MacLauncher-Setup.exe
            target/release/win-launcher.exe

      - name: Upload Artifacts (for manual workflow runs)
        uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: MacLauncher-Setup
          path: target/installer/MacLauncher-Setup.exe
